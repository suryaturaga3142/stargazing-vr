[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk

build_src_flags = 
    -O3



; ------------------------------
; Include paths
; ------------------------------
; PlatformIO automatically sets ${lib_dir}/include for headers, but we also need FatFs source and SD sources
build_flags =
    -I include                           ; your own project headers
    -I src                                ; your own hw_config etc.
    -I lib/no-OS-FatFS-SD-SDIO-SPI-RPi-Pico/include
    -I lib/no-OS-FatFS-SD-SDIO-SPI-RPi-Pico/src
    

; ------------------------------
; Debug & upload settings
; ------------------------------
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

