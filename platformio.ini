[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk

# --- Build Flags for Optimization and Libraries ---
build_flags =
    -O3
    -D PICO_CMSIS_DSP_INSTRUCTIONS=1
    -D PICO_USE_SDIO=1
    -I include
    -I include/drivers
    -I include/systems

# --- PIO Assembly File Processing ---
board_build.pio = src/drivers/ili9486_8080.pio # Or .s

# --- External Library Dependencies ---
lib_ldf_mode = chain+
lib_deps =
    # --- Pico Extras (for SDIO) ---
    https://github.com/raspberrypi/pico-extras.git
    
    # --- Minmea (for GPS) ---
    https://github.com/kosma/minmea.git

# --- Source Filter for pico-extras ---
# This tells PlatformIO to ONLY build the necessary parts of pico-extras
lib_extra_dirs = ${sysenv.PLATFORMIO_LIBDEPS_DIR}/${this.__env__}/pico-extras
lib_compat_mode = off
build_src_filter =
    +<*> ; Include all project src/, lib/, and minmea sources
    
    # Filter pico-extras: Exclude all by default
    -<../.pio/libdeps/${this.__env__}/pico-extras> 
    
    # Explicitly include only the needed parts of pico-extras
    +<../.pio/libdeps/${this.__env__}/pico-extras/src/rp2_common/hardware_sdio> ; SDIO driver
    +<../.pio/libdeps/${this.__env__}/pico-extras/lib/fatfs/src/ff.c>          ; FatFs core
    +<../.pio/libdeps/${this.__env__}/pico-extras/lib/fatfs/src/diskio.c>       ; FatFs disk I/O
    +<../.pio/libdeps/${this.__env__}/pico-extras/lib/fatfs/src/ffsystem.c>    ; FatFs system calls
    +<../.pio/libdeps/${this.__env__}/pico-extras/lib/fatfs/src/ffunicode.c>  ; FatFs Unicode support

# --- Debug / Upload Settings ---
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200