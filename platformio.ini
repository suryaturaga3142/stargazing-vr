[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk

# For regular work
# build_src_flags = -O0
# For release builds with optimizations
build_flags = 
    -O3
    -std=c++17
    -D ARM_MATH_CM33        # Target the Cortex-M33 core (RP2350)
    -D __FPU_PRESENT=1      # Enable Hardware Floating Point Unit
    -D ARM_MATH_DSP         # Enable DSP instruction set extensions
    -I include/drivers
    -I include/systems
    -I include/third_party
    -I include/third_party/BNO08x_Pico_Library
    -I include/third_party/fatfs

board_build.pio = src/drivers/ili9486_8080.pio

# Add any required libraries here
# lib_deps =
#     https://github.com/ARM-software/CMSIS-DSP.git#v1.15.0

debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200