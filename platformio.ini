[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk

# --- Build Flags for Optimization and Libraries ---
# Use -O3 for release builds. Use -O0 for debugging.
build_flags =
    -O3
    -D PICO_CMSIS_DSP_INSTRUCTIONS=1
    -I include
    -I include/drivers
    -I include/systems
    -I include/imported

# --- PIO Assembly File Processing ---
# Add BOTH PIO programs, using MCU required .pio extension
board_build.pio =
    pio/ili9486_8080.pio
    pio/sd_card_sdio.pio

# --- External Library Dependencies ---
lib_ldf_mode = chain+ # Helps PlatformIO resolve dependencies correctly
lib_deps =
    # NOTE: Need Pico SDK specific drivers/ports for BNO085 & UBX commands.
    # NOTE: Add minmea source files manually to lib/minmea or find package.

# --- Source Filtering ---
# Ensure all source files in src/ AND src/imported/ are compiled
lib_compat_mode = off
build_src_filter =
    +<*> # Includes src/* by default
    +<imported/*> # Explicitly include imported source files
    +<drivers/*> # Explicitly include driver files

# --- Debug / Upload Settings ---
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200